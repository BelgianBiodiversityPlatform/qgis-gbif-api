name: Release plugin

# Cut a release by publishing a GitHub Release whose tag is a bare version
# number, e.g. `gh release create 0.4.1 --generate-notes` (see RELEASING.md).
# qgis-plugin-ci does NOT create the GitHub Release; it attaches the built zip
# to the release that publishing this event has already created, so we must
# trigger on the release, not on a bare tag push.
# Do NOT prefix the tag with "v": qgis-plugin-ci writes the tag verbatim into
# metadata.txt as the plugin version, and we want "0.4.1", not "v0.4.1".
on:
  release:
    types: [published]

# Needed so the automatic GITHUB_TOKEN can attach the plugin zip as an asset to
# the published GitHub Release.
permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history, needed for changelog generation)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install qgis-plugin-ci
        run: pip install qgis-plugin-ci

      - name: Build, create GitHub release, and publish to plugins.qgis.org
        run: >-
          qgis-plugin-ci release ${{ github.ref_name }}
          --github-token ${{ secrets.GITHUB_TOKEN }}
          --osgeo-username ${{ secrets.OSGEO_USERNAME }}
          --osgeo-password ${{ secrets.OSGEO_PASSWORD }}
